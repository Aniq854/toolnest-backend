<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Video Clipper — Coming Soon | ToolNest</title>
<meta name="description" content="ToolNest AI Video Clipper is launching soon — turn long videos into viral shorts." />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f6f8;--surface:#fff;--border:#e5e9f0;--text:#1e293b;--muted:#64748b;--heading:#0f172a;--primary:#4f46e5;--clip:#8b5cf6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
  a{text-decoration:none;color:inherit}
  header.site{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .hbar{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:62px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;color:var(--heading)}
  .brand .mk{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--primary);color:#fff;font-size:15px}
  .nav a{padding:8px 14px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--muted)}
  .nav a:hover{background:var(--bg);color:var(--text)}
  .center{max-width:560px;margin:0 auto;padding:90px 20px;text-align:center}
  .ic{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;font-size:40px;margin:0 auto 26px;background:#f5f3ff;color:var(--clip)}
  h1{font-size:34px;font-weight:800;color:var(--heading);margin-bottom:14px;letter-spacing:-.5px}
  p{color:var(--muted);font-size:16px;margin-bottom:30px;line-height:1.6}
  .btn{display:inline-block;background:var(--primary);color:#fff;padding:13px 28px;border-radius:11px;font-weight:600}
  .btn:hover{background:#4338ca}
  .badge{display:inline-block;background:#f5f3ff;color:var(--clip);font-weight:600;font-size:13px;padding:6px 14px;border-radius:20px;margin-bottom:22px}
</style>
</head>
<body>
<header class="site">
  <div class="hbar">
    <a href="/" class="brand"><span class="mk">🧰</span> ToolNest</a>
    <nav class="nav">
      <a href="/pdf">PDF Tools</a>
      <a href="/humanizer">AI Humanizer</a>
      <a href="/">← Home</a>
    </nav>
  </div>
</header>
<div class="center">
  <div class="ic">🎬</div>
  <span class="badge">Launching soon</span>
  <h1>Video Clipper is coming soon</h1>
  <p>Our AI Video Clipper turns long videos into viral 9:16 shorts for TikTok, Reels and YouTube Shorts. We're putting the finishing touches on it — check back shortly!</p>
  <a href="/" class="btn">← Back to Home</a>
</div>
</body>
</html>
